<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(10px, 1.8vh, 18px);
            width: 100%;
            height: 100%;
            justify-content: center;
            transform: translateY(-9vh);
        }
        
        .clock-container {
            position: relative;
            animation: zoomOut 3s ease-in-out forwards;
        }
        
        .clock {
            width: clamp(110px, 10vw, 160px);
            height: clamp(110px, 10vw, 160px);
            border: clamp(8px, 0.75vw, 12px) solid #2c5b91;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.95);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 12px 28px rgba(27, 66, 106, 0.2);
        }
        
        .clock-center {
            width: 10%;
            aspect-ratio: 1;
            background-color: #2c5b91;
            border-radius: 50%;
            position: absolute;
            top: 45%;
            left: 45%;
            z-index: 3;
        }
        
        .stopwatch-knob {
            width: 10%;
            height: 19%;
            background-color: #2c5b91;
            position: absolute;
            top: -17%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px 8px 3px 3px;
            z-index: 1;
        }
        
        .stopwatch-knob::before {
            content: '';
            position: absolute;
            top: -31%;
            left: 50%;
            transform: translateX(-50%);
            width: 160%;
            height: 42%;
            background-color: #2c5b91;
            border-radius: 10px 10px 5px 5px;
        }
        
        .stopwatch-knob::after {
            content: '';
            position: absolute;
            top: -12%;
            left: 50%;
            transform: translateX(-50%);
            width: 78%;
            height: 28%;
            background-color: #2c5b91;
            border-radius: 50%;
        }
        
        .hour-hand {
            width: 8%;
            height: 29%;
            background-color: #2c5b91;
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-30deg);
            border-radius: 8px 8px 0 0;
            z-index: 2;
        }
        
        .minute-hand {
            width: 6%;
            height: 39%;
            background-color: #2c5b91;
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            border-radius: 7px 7px 0 0;
            z-index: 1;
            animation: sweep 3s ease-in-out forwards;
        }
        
        .mathnow-logo {
            opacity: 1;
            width: auto;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .logo-title {
            font-family: Arial, sans-serif;
            font-size: clamp(54px, 6vw, 96px);
            font-weight: 800;
            margin: 0;
            text-align: center;
            line-height: 0.95;
            letter-spacing: -0.045em;
            filter: drop-shadow(0 8px 12px rgba(31, 72, 112, 0.2));
        }
        
        .logo-tagline {
            font-family: Arial, sans-serif;
            font-size: clamp(13px, 3.25vw, 65px);
            color: #1e3a5f;
            text-align: left;
            white-space: nowrap;
            width: 100%;
            margin-left: clamp(2px, 0.5vw, 12px);
        }
        
        @keyframes zoomOut {
            0% {
                transform: scale(10);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes sweep {
            0% {
                transform: translateX(-50%) rotate(0deg);
            }
            100% {
                transform: translateX(-50%) rotate(390deg);
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Portrait mode adjustments for mobile devices */
        @media (orientation: portrait) and (max-width: 768px) {
            .main-container {
                gap: clamp(8px, 1.5vh, 14px);
                transform: translateY(-8vh);
            }
            
            .mathnow-logo {
                width: auto;
                align-items: center;
            }
            
            .logo-title {
                font-size: clamp(46px, 13vw, 72px);
                text-align: center;
            }
            
            .logo-tagline {
                font-size: clamp(10px, 3vw, 30px);
                text-align: center;
                margin-left: 0;
            }
            
            .clock {
                width: clamp(100px, 28vw, 138px);
                height: clamp(100px, 28vw, 138px);
            }
        }
        
        /* Landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .main-container {
                gap: 7px;
                transform: translateY(-9vh);
            }
            
            .mathnow-logo {
                width: auto;
                height: auto;
            }
            
            .logo-title {
                font-size: clamp(44px, 7vw, 62px);
            }
            
            .logo-tagline {
                font-size: clamp(10px, 2.5vw, 40px);
            }

            .clock {
                width: clamp(86px, 15vh, 108px);
                height: clamp(86px, 15vh, 108px);
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="clock-container">
            <div class="clock">
                <div class="stopwatch-knob"></div>
                <div class="hour-hand"></div>
                <div class="minute-hand" id="minuteHand"></div>
                <div class="clock-center"></div>
            </div>
        </div>
        
        <div class="mathnow-logo" id="logo">
            <div class="logo-title">
                <span style="color: #163f70;">Math</span><span style="color: #2f8ff0;">Now</span>
            </div>
        </div>
    </div>

    <script>
        function showLogo() {
            const logo = document.getElementById('logo');
            logo.style.animation = 'fadeIn 1s ease-in forwards';
        }
        
        // Auto-start animation when page loads
        window.addEventListener('load', () => {
            // Logo is already visible, no need to show it
        });
    </script>
</body>
</html>
